# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: spike-agent365-apim-tools-gateway

# One Terraform root (infra/): each file is one part of the architecture, built from the modules in infra/modules;
# connections.tf wires the optional parts together. Put the spike's own resources in a new file of infra/.
infra:
  provider: terraform
  path: infra

services:
  notes-mcp:
    project: ./services/notes-mcp
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      # Images are built in the project's registry: no local Docker needed to deploy.
      remoteBuild: true
  chat-ui:
    project: ./services/chat-ui
    language: ts
    host: containerapp
    docker:
      path: ./Dockerfile
      # Images are built in the project's registry: no local Docker needed to deploy.
      remoteBuild: true

# Each event runs the steps of infra/hooks/<event>/ in name order (infra/hooks/run.sh): what Terraform cannot do.
hooks:
  preprovision:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh preprovision
      interactive: false
      continueOnError: false
  postprovision:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh postprovision
      interactive: false
      continueOnError: false
  postdeploy:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh postdeploy
      interactive: false
      continueOnError: false
  predown:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh predown
      interactive: false
      continueOnError: false
